name: flutter_app_template
description: "Modelo de app Flutter com Clean Architecture, Bloc e design system claro/escuro."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0

  # Estado, DI e navegação
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^17.5.0

  # Rede
  connectivity_plus: ^7.0.0
  http: ^1.4.0

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3

  # Plataforma
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2

  # UI
  cached_network_image: ^3.4.1
  flutter_screenutil_plus: ^2.0.0
  flutter_svg: ^2.1.0
  google_fonts: ^8.2.1
  intl: ^0.20.2

  # Observabilidade
  logger: ^2.8.0
  sentry_flutter: ^9.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^10.0.0
  change_app_package_name: ^1.5.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/vectors/
    - assets/audios/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
